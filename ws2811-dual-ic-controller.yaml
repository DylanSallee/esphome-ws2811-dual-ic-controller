###########
# SOURCES #
###########
# - https://smlight.tech/manual/slwf-03/faq-and-lifehacks/
# - https://github.com/smlight-dev/A1-SLWF-03/blob/main/a1-slwf-03-voice-assistant.yaml
# - https://esphome.io/components/remote_receiver/
# - https://esphome.io/guides/setting_up_rmt_devices/#setting-up-ir-devices
# - https://esphome.io/components/microphone/i2s_audio/
# - https://github.com/wled/WLED/issues/4641

######################################
# SUBSTITUTIONS (USER CONFIGURATION) #
######################################
substitutions:
    # -------------------------------
    # WS2811 Dual IC LED Strip Config
    # -------------------------------
    # ws2811_strip_num_ics: the number of ICs on your strip. This is double the number of physical segments.
    ws2811_strip_num_ics: "28" # 28 ICs per m * 1m = 14 segments
    # ws2811_wire_order: the byte order of one segment. The first three bytes go to the segment's first IC.
    # R, G and B are the color LEDs, C is cold white, W is warm white, and X is the unused byte.
    ws2811_wire_order: "RGBWCX"
    # ws2811_cw_color_temp: the color temperature of the cold white LEDs in Kelvin
    ws2811_cw_color_temp: "6000 K"
    # ws2811_ww_color_temp: the color temperature of the warm white LEDs in Kelvin
    ws2811_ww_color_temp: "3000 K"
    # ws2811_default_power_limit: the default Power Limit in percent, which is otherwise configurable in Home Assistant.
    # 100 is every channel fully on, which an RGB or white color never asks for. Set low initially because these
    # strips can become very hot, especially when testing on the spool.
    ws2811_default_power_limit: "15"
    # ws2811_color_gamma: decodes colors for the LEDs. 2.2 matches how Home Assistant encodes them.
    ws2811_color_gamma: "2.2"
    # ws2811_brightness_gamma: the curve of the brightness slider. Lower it to lift the bottom of the slider.
    ws2811_brightness_gamma: "2.2"
    # The next four are only starting points for the sliders in Home Assistant. See "Matching Philips Hue" in the README.
    # ws2811_default_red_balance, green and blue: scale the color LEDs in percent, so that equal amounts look neutral.
    ws2811_default_red_balance: "100"
    ws2811_default_green_balance: "60"
    ws2811_default_blue_balance: "35"
    # ws2811_default_white_strength: one white channel at full, in percent of the balanced color LEDs at full.
    ws2811_default_white_strength: "100"
    # ------------------------
    # Controller Device Config
    # ------------------------
    # controller_device_friendly_name: frontend name of the WS2811 strip
    controller_device_friendly_name: "WS2811 Dual IC RGBCCT LED Strip Controller"
    # controller_device_id: backend ID of the custom device for sub-device grouping
    controller_device_id: "ws2811_controller"
    # controller_device_led_data_pin: pin connected to the LED strip data line.
    controller_device_led_data_pin: GPIO16
    # controller_device_status_blue_pin: pin connected to the blue status LED. Remove switch -> led_blue and the led_blue actions under binary_sensor -> Connected if not applicable.
    controller_device_status_blue_pin: GPIO22
    # controller_device_status_green_pin: pin connected to the green status LED. Remove switch -> led_green and the led_green actions under binary_sensor -> Connected if not applicable.
    controller_device_status_green_pin: GPIO23
    # controller_device_touch_button_pin: pin connected to the touch button. Remove binary_sensor -> Touch Button if not applicable.
    controller_device_touch_button_pin: GPIO26
    # controller_device_ir_receiver_pin: pin connected to the IR receiver. Remove remote_receiver and infrared if not applicable.
    controller_device_ir_receiver_pin: GPIO4
    # controller_device_microphone_i2s_bclk_pin: pin connected to the microphone I2S BCLK pin. Remove sensor -> sound_level, i2s_audio, and microphone if not applicable.
    controller_device_microphone_i2s_bclk_pin: GPIO14
    # controller_device_microphone_i2s_lrclk_pin: pin connected to the microphone I2S LRCLK pin. Remove sensor -> sound_level, i2s_audio, and microphone if not applicable.
    controller_device_microphone_i2s_lrclk_pin: GPIO15
    # controller_device_microphone_i2s_din_pin: pin connected to the microphone I2S DIN pin. Remove sensor -> sound_level, i2s_audio, and microphone if not applicable.
    controller_device_microphone_i2s_din_pin: GPIO32

    # --------------
    # Network Config
    # --------------
    # to use, uncomment the lines under wifi -> manual_ip
    # static_ip: Static IP address for the ESP32
    # static_ip: "192.168.xxx.xxx"
    # gateway: Network gateway IP address
    # gateway: "192.168.xxx.xxx"
    # subnet: Network subnet mask
    # subnet: "255.255.255.xxx"

    # ------------------------------
    # SMLIGHT A1-SLWF-03 Node Config
    # ------------------------------
    # node_friendly_name: frontend name of the node
    node_friendly_name: "SMLIGHT A1-SLWF-03"
    # node_name: backend name of the node
    node_name: "smlight-a1-slwf-03"

    # ----------------
    # Log Level Config
    # ----------------
    # log_level: Log level for the device(s). DEBUG, INFO, WARNING, ERROR. Defaults to INFO.
    log_level: "INFO"

########################
# DEVICE CONFIGURATION #
########################
esphome:
    # ------------
    # ESP32 Device
    # ------------
    name: "${node_name}"
    friendly_name: "${node_friendly_name}"
    min_version: "2026.10.0"
    project:
        name: "dylansallee.ws2811-dual-ic-controller"
        version: "2.1"
    name_add_mac_suffix: true

    # --------------
    # Custom Devices
    # --------------
    devices:
        - id: "${controller_device_id}"
          name: "${controller_device_friendly_name}"

# The light itself lives in this repository, because ESPHome has no five channel strip support yet.
# If this file is copied somewhere else, replace "components" with:
#   source: github://DylanSallee/esphome-ws2811-dual-ic-controller@main
external_components:
    - source: components
      components: [ws2811_dual_ic]

esp32:
    board: esp32dev
    framework:
        # type: arduino
        type: esp-idf

logger:
    level: ${log_level}
    hardware_uart: UART0

# required for debug sensors (loop_time, free_heap, etc.)
debug:

api:
    encryption:
        key: !secret api_encryption_key

ota:
    - platform: esphome
      encryption:

wifi:
    ssid: !secret wifi_ssid
    password: !secret wifi_password

    # manual_ip:
    #   static_ip: ${static_ip}
    #   gateway: ${gateway}
    #   subnet: ${subnet}

    ap:
        ssid: ${node_name}
        password: !secret fallback_wifi_password

captive_portal:

safe_mode:
    boot_is_good_after: 1min
    num_attempts: 10
    reboot_timeout: 5min

# if wled is required, set framework to arduino, uncomment wled: below, and uncomment - wled: in light -> dual_ic_strip -> effects
# wled:

########################
# NUMBER CONFIGURATION #
########################
number:
    - platform: template
      name: "Power Limit"
      id: power_limit
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:flash-outline"
      unit_of_measurement: "%"
      mode: slider
      min_value: 1
      max_value: 100
      step: 1
      initial_value: ${ws2811_default_power_limit}
      optimistic: true
      restore_value: true
      on_value:
          - lambda: id(strip_output).set_power_limit(x / 100.0f);

    # Color calibration. These apply immediately, so they can be tuned against a reference light.
    - platform: template
      name: "Red Balance"
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:palette"
      unit_of_measurement: "%"
      mode: slider
      min_value: 1
      max_value: 100
      step: 1
      initial_value: ${ws2811_default_red_balance}
      optimistic: true
      restore_value: true
      disabled_by_default: true
      on_value:
          - lambda: id(strip_output).set_color_balance(0, x / 100.0f);

    - platform: template
      name: "Green Balance"
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:palette"
      unit_of_measurement: "%"
      mode: slider
      min_value: 1
      max_value: 100
      step: 1
      initial_value: ${ws2811_default_green_balance}
      optimistic: true
      restore_value: true
      disabled_by_default: true
      on_value:
          - lambda: id(strip_output).set_color_balance(1, x / 100.0f);
    - platform: template
      name: "Blue Balance"
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:palette"
      unit_of_measurement: "%"
      mode: slider
      min_value: 1
      max_value: 100
      step: 1
      initial_value: ${ws2811_default_blue_balance}
      optimistic: true
      restore_value: true
      disabled_by_default: true
      on_value:
          - lambda: id(strip_output).set_color_balance(2, x / 100.0f);
    - platform: template
      name: "White Strength"
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:white-balance-sunny"
      unit_of_measurement: "%"
      mode: slider
      min_value: 10
      max_value: 400
      step: 5
      initial_value: ${ws2811_default_white_strength}
      optimistic: true
      restore_value: true
      disabled_by_default: true
      on_value:
          - lambda: id(strip_output).set_white_strength(x / 100.0f);

########################
# SENSOR CONFIGURATION #
########################
sensor:
    # ------------------
    # Microphone Sensors
    # ------------------
    - platform: sound_level
      microphone: controller_microphone
      passive: false
      rms:
          name: "Ambient Sound Level Average"
      peak:
          name: "Ambient Sound Level Peak"

    # -----------------------------
    # LED Strip Sensors - Diagnostic
    # -----------------------------
    - platform: template
      name: "Strip Load"
      device_id: ${controller_device_id}
      state_class: measurement
      entity_category: diagnostic
      icon: "mdi:gauge"
      unit_of_measurement: "%"
      accuracy_decimals: 1
      update_interval: 10s
      lambda: return id(strip_output).get_load() * 100.0f;

    # --------------------------
    # ESP32 Sensors - Diagnostic
    # --------------------------
    - platform: internal_temperature
      name: "Internal Temperature"
      device_class: temperature
      state_class: measurement
      entity_category: diagnostic
      unit_of_measurement: "°C"
      accuracy_decimals: 0
      update_interval: 30s

    - platform: uptime
      type: seconds
      name: "Uptime"
      device_class: duration
      state_class: measurement
      entity_category: diagnostic
      unit_of_measurement: "s"
      accuracy_decimals: 0
      update_interval: 60s

    - platform: template
      name: "Free Memory"
      device_class: data_size
      state_class: measurement
      entity_category: diagnostic
      unit_of_measurement: "kB"
      accuracy_decimals: 0
      update_interval: 60s
      disabled_by_default: true
      lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL) / 1024;

    - platform: debug
      loop_time:
          name: "Loop Time"
          state_class: measurement
          entity_category: diagnostic
          unit_of_measurement: "ms"
          accuracy_decimals: 1
          disabled_by_default: true

      free:
          name: "Free Heap"
          device_class: data_size
          state_class: measurement
          entity_category: diagnostic
          accuracy_decimals: 0
          disabled_by_default: true

      block:
          name: "Max Free Block"
          device_class: data_size
          state_class: measurement
          entity_category: diagnostic
          accuracy_decimals: 0

###############################
# BINARY SENSOR CONFIGURATION #
###############################
binary_sensor:
    # ---------------------------------
    # ESP32 Binary Sensors - Diagnostic
    # ---------------------------------
    - platform: status
      name: "Connected"
      device_class: connectivity
      entity_category: diagnostic
      on_press:
          - switch.turn_on: led_green
          - switch.turn_off: led_blue
      on_release:
          - switch.turn_off: led_green
          - switch.turn_on: led_blue
    # -----------------------------------------
    # Custom Device Binary Sensors - Functional
    # -----------------------------------------
    # TTP223 Touch Button Sensor
    - platform: gpio
      name: "Touch Button"
      pin: ${controller_device_touch_button_pin}
      disabled_by_default: true

#############################
# TEXT SENSOR CONFIGURATION #
#############################
text_sensor:
    # -------------------------------
    # ESP32 Text Sensors - Diagnostic
    # -------------------------------
    - platform: version
      name: "ESPHome Version"
      icon: mdi:source-branch
      entity_category: diagnostic
    - platform: wifi_info
      ip_address:
          name: "IP Address"
          icon: mdi:ip-network
          entity_category: diagnostic
    - platform: debug
      reset_reason:
          name: "Restart Reason"
          icon: mdi:restart
          entity_category: diagnostic

########################
# SWITCH CONFIGURATION #
########################
switch:
    # Turn this off to see the color LEDs alone while setting the balance sliders.
    - platform: template
      name: "Use White LEDs for Colors"
      device_id: ${controller_device_id}
      entity_category: config
      icon: "mdi:palette-swatch"
      optimistic: true
      restore_mode: RESTORE_DEFAULT_ON
      disabled_by_default: true
      on_turn_on:
          - lambda: id(strip_output).set_white_mix(true);
      on_turn_off:
          - lambda: id(strip_output).set_white_mix(false);

    # ----------------------
    # Custom Device Switches
    # ----------------------
    # On board LEDs
    - platform: gpio
      name: "Status LED (Blue)"
      id: "led_blue"
      pin: ${controller_device_status_blue_pin}
      entity_category: config
      restore_mode: ALWAYS_ON
      disabled_by_default: true # normally used to indicate connection status via Connected binary sensor
    - platform: gpio
      name: "Status LED (Green)"
      id: "led_green"
      pin: ${controller_device_status_green_pin}
      entity_category: config
      restore_mode: ALWAYS_OFF
      disabled_by_default: true # normally used to indicate connection status via Connected binary sensor

########################
# BUTTON CONFIGURATION #
########################
button:
    # --------------------------
    # ESP32 Buttons - Diagnostic
    # --------------------------
    - platform: restart
      name: "Restart"
      entity_category: config
      device_class: restart
    - platform: shutdown
      name: "Shutdown"
      entity_category: config
      disabled_by_default: true
    - platform: safe_mode
      name: "Restart (Safe Mode)"
      entity_category: config
    - platform: factory_reset
      name: "Reset to Factory Default Settings"
      icon: mdi:close-octagon
      entity_category: config
      disabled_by_default: true

#######################
# LIGHT CONFIGURATION #
#######################
light:
    # The strip driver. The light below uses it to send raw bytes, so it has no effects or brightness of its own.
    # channel_colors stays RGB here: set the real byte order with ws2811_wire_order instead.
    - platform: esp32_rmt_led_strip
      id: physical_strip
      internal: true
      chipset: ws2811
      channel_colors: RGB
      pin: ${controller_device_led_data_pin}
      num_leds: ${ws2811_strip_num_ics}

    # The one light Home Assistant sees. Each pixel is one physical segment, so effects need no extra setup.
    # A color uses the white LEDs for whatever white it contains, so whites look right and saturated colors stay pure.
    - platform: ws2811_dual_ic
      name: "WS2811 Dual IC LED Strip - RGBCCT"
      id: dual_ic_strip
      output_id: strip_output
      device_id: ${controller_device_id}
      strip_id: physical_strip
      wire_order: ${ws2811_wire_order}
      cold_white_color_temperature: ${ws2811_cw_color_temp}
      warm_white_color_temperature: ${ws2811_ww_color_temp}
      gamma_correct: ${ws2811_color_gamma}
      brightness_gamma: ${ws2811_brightness_gamma}
      power_limit: ${ws2811_default_power_limit}%
      restore_state: all
      effects:
          - pulse:
          - random:
          - strobe:
          - flicker:
          - addressable_rainbow:
          - addressable_color_wipe:
          - addressable_scan:
          - addressable_twinkle:
          - addressable_random_twinkle:
          - addressable_fireworks:
          - addressable_flicker:
                intensity: 15% # default 5% is too hard to see imo
          # if wled is required, set framework to arduino, uncomment - wled: below, and uncomment wled: in base configuration
          # - wled:

#############################
# IR RECEIVER CONFIGURATION #
#############################
# see https://esphome.io/components/remote_receiver/ and https://esphome.io/guides/setting_up_rmt_devices/#setting-up-ir-devices for further configuration details
remote_receiver:
    pin:
        number: ${controller_device_ir_receiver_pin}
        inverted: true
        mode:
            input: true
            pullup: true
    dump: raw # will dump raw received IR commands to logs so you can customize based on your individual remote device

############################
# MICROPHONE CONFIGURATION #
############################
#
i2s_audio:
    i2s_lrclk_pin: ${controller_device_microphone_i2s_lrclk_pin}
    i2s_bclk_pin: ${controller_device_microphone_i2s_bclk_pin}

microphone:
    - platform: i2s_audio
      id: controller_microphone
      i2s_din_pin: ${controller_device_microphone_i2s_din_pin}
      adc_type: external
      pdm: false
      bits_per_sample: 32bit
      channel: left
