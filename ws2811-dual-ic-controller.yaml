########################
# OUTPUT CONFIGURATION #
########################
output:
  # Template outputs bridge logic_strip's color channels to the
  # current_colors global. The Direct Control effect on physical_strip
  # reads these values every frame, so no script call is needed.
  - platform: template
    id: out_red
    type: float
    write_action:
      - lambda: id(current_colors)[0] = state;
  - platform: template
    id: out_green
    type: float
    write_action:
      - lambda: id(current_colors)[1] = state;
  - platform: template
    id: out_blue
    type: float
    write_action:
      - lambda: id(current_colors)[2] = state;
  - platform: template
    id: out_cwhite
    type: float
    write_action:
      - lambda: id(current_colors)[3] = state;
  - platform: template
    id: out_wwhite
    type: float
    write_action:
      - lambda: id(current_colors)[4] = state;

# (update_strip script removed - rendering is now handled by the
#  Direct Control addressable_lambda effect on physical_strip)

#############################
# IR RECEIVER CONFIGURATION #
#############################
# see https://esphome.io/components/remote_receiver/ and https://esphome.io/guides/setting_up_rmt_devices/#setting-up-ir-devices for further configuration details
remote_receiver:
  pin:
    number: ${controller_device_ir_receiver_pin}
    inverted: true
    mode:
      input: true
      pullup: true
  dump: raw # will dump raw recieved IR commands to logs so you can customize based on your individual remote device

############################
# MICROPHONE CONFIGURATION #
############################
#
i2s_audio:
  i2s_lrclk_pin: GPIO15
  i2s_bclk_pin: GPIO14

microphone:
  - platform: i2s_audio
    id: controller_microphone
    i2s_din_pin: GPIO32
    adc_type: external
    pdm: false
    bits_per_sample: 32bit
    channel: left
